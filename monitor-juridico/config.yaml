# Configuración del monitor jurídico. Puedes editar este archivo directamente en GitHub.

dof:
  # 1 = solo lo más importante (Constitución, leyes, reformas, sentencias SCJN)
  # 2 = también acuerdos de la SCJN, Poder Judicial y reglamentos
  # 3 = también otros decretos y acuerdos generales
  # 4 = absolutamente todo lo que se publique
  prioridad_maxima: 2
  # Días hacia atrás que revisa la primera vez que corre
  dias_iniciales: 3
  # Si el título de una nota contiene alguna de estas palabras, sube de nivel
  palabras_clave:
    - Ley de Amparo
    - Código Nacional de Procedimientos Penales
    - Ley Orgánica del Poder Judicial
    - Código Civil Federal
    - derechos humanos

semanario:
  # Épocas a vigilar: 210 = Duodécima (vigente), 200 = Undécima
  epocas: ["210"]
  # Qué instancias te interesan. "Pleno" = Pleno de la SCJN (coincidencia exacta);
  # los demás valores funcionan como "contiene". Escribe "todas" para incluir
  # también Tribunales Colegiados (son muchísimas tesis). Al final de cada correo
  # verás cuántas tesis nuevas hubo por instancia, para ajustar esto.
  instancias: ["Pleno", "Suprema Corte", "Plenos Regionales"]
  # La primera vez, cuántas de las tesis más recientes mostrar como muestra
  mostrar_al_iniciar: 15
  # Máximo de tesis nuevas a las que se les descarga el texto completo por corrida
  max_detalles: 80

comunicados:
  # Punto de partida si el programa nunca ha corrido (comunicado del 31/ago/2026)
  id_inicial: 8545
  # La primera vez, solo se reportan los comunicados de estos últimos días
  dias_iniciales: 10
  # Si no hay fechas disponibles, cuántos de los más recientes mostrar la primera vez
  mostrar_al_iniciar: 6

materias:
  # Materias que más te interesan. Opciones: Constitucional, Derechos humanos, Penal,
  # Civil y familiar, Mercantil, Laboral y seguridad social, Administrativa, Fiscal,
  # Electoral, Competencia y telecomunicaciones, Municipal y federalismo.
  # Vacío = todas por igual.
  interes: ["Constitucional"]
  # priorizar = todo llega, pero lo de tus materias va primero y marcado con ★
  # filtrar   = en el correo solo aparece lo de tus materias (más reformas
  #             constitucionales, leyes nuevas y alertas de vigencia, que siempre llegan)
  # En los dos casos el archivo histórico (para la página) guarda todo completo.
  modo: priorizar

envio:
  # Enviar correo/Telegram aunque no haya novedades (para saber que sigue vivo)
  enviar_si_vacio: false
  # compacto = asuntos de trámite agrupados en una línea, votaciones unánimes resumidas
  # completo = todo el detalle de cada asunto en el correo
  formato: compacto

archivo:
  # Tesis de la SCJN (Pleno y Salas) de épocas anteriores que se guardan para la página.
  # 200 = Undécima, 100 = Décima, 5 = Novena, 4 = Octava. Deja la lista vacía para no descargarlas.
  epocas_anteriores: ["200", "100", "5", "4"]
  # Páginas de 200 tesis que se descargan por revisión (25 ≈ 5,000 tesis, ~1-2 minutos)
  paginas_por_corrida: 25
