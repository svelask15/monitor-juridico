<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor jurídico · Archivo</title>
<style>
  :root{
    --tinta:#1d1b1a; --suave:#5f5a55; --linea:#e4ddd3; --papel:#faf7f2; --blanco:#fff;
    --vino:#6d1f2f; --vino-claro:#f3e6e8; --oro:#a57a1c; --oro-claro:#f8f0dc;
    --azul:#1f4e79; --verde:#2f6b3b; --gris:#8a847d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 "Iowan Old Style","Palatino Linotype",Georgia,serif}
  a{color:var(--azul)}
  header{background:var(--vino);color:#fff;padding:22px 20px 18px}
  header h1{margin:0;font-size:26px;letter-spacing:.3px;font-weight:600}
  header p{margin:4px 0 0;opacity:.85;font:13px system-ui,sans-serif}
  nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--linea);padding:0 12px;position:sticky;top:0;z-index:5}
  nav button{border:0;background:none;padding:12px 12px;font:600 14px system-ui,sans-serif;color:var(--suave);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
  nav button.activo{color:var(--vino);border-bottom-color:var(--vino)}
  .contenedor{max-width:1100px;margin:0 auto;padding:16px}
  .filtros{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:14px;display:grid;gap:10px;font-family:system-ui,sans-serif;font-size:14px}
  .filtros{grid-template-columns:minmax(0,1fr)}
  .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
  .filtros input[type=search]{flex:1;min-width:0;width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:8px;font-size:15px}
  .filtros select{flex:1 1 180px;max-width:100%;min-width:0}
  .filtros input[type=date]{flex:0 1 150px;min-width:0}
  .filtros select,.filtros input[type=date]{padding:7px 8px;border:1px solid var(--linea);border-radius:8px;background:#fff;font-size:14px}
  .chip{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:4px 11px;font:13px system-ui,sans-serif;cursor:pointer;color:var(--suave)}
  .chip.on{background:var(--vino);border-color:var(--vino);color:#fff}
  label.check{display:flex;gap:6px;align-items:center;color:var(--suave)}
  .resumen{margin:14px 2px 6px;color:var(--suave);font:13px system-ui,sans-serif;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .dia{margin:22px 0 8px;font:700 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.8px;color:var(--gris)}
  .tarjeta{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--gris);border-radius:8px;padding:12px 14px;margin:8px 0}
  .tarjeta.sesion{border-left-color:var(--vino)} .tarjeta.agenda{border-left-color:var(--oro)}
  .tarjeta.tesis{border-left-color:var(--azul)} .tarjeta.dof{border-left-color:var(--verde)}
  .tarjeta.comunicado{border-left-color:var(--suave)} .tarjeta.scjn{background:linear-gradient(90deg,var(--oro-claro),#fff 40%)}
  .meta{font:12.5px system-ui,sans-serif;color:var(--suave);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .badge{font:600 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:4px;background:#eee;color:var(--suave)}
  .badge.sesion{background:var(--vino-claro);color:var(--vino)} .badge.agenda{background:var(--oro-claro);color:var(--oro)}
  .badge.tesis{background:#e4edf6;color:var(--azul)} .badge.dof{background:#e5f0e6;color:var(--verde)}
  .badge.alerta{background:#fde8d8;color:#9a3b0b}
  .titulo{font-size:16.5px;font-weight:600;margin:4px 0 2px}
  .texto{margin:4px 0;color:#2f2b28}
  .mats{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .mat{font:12px system-ui,sans-serif;background:var(--papel);border:1px solid var(--linea);border-radius:999px;padding:1px 8px;color:var(--suave)}
  .acciones{font:13px system-ui,sans-serif;margin-top:8px;display:flex;flex-wrap:wrap;gap:12px}
  .acciones button{background:none;border:0;color:var(--azul);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
  details{margin-top:6px} summary{cursor:pointer;color:var(--azul);font:13px system-ui,sans-serif}
  .bloque{font-size:14px;color:#3b3632;margin:6px 0;white-space:pre-wrap}
  ul.votos{margin:6px 0;padding-left:18px;font-size:14px}
  .vacio{text-align:center;color:var(--suave);padding:50px 10px;font-family:system-ui,sans-serif}
  .mas{display:block;margin:16px auto;padding:10px 18px;border-radius:8px;border:1px solid var(--linea);background:#fff;cursor:pointer;font:14px system-ui,sans-serif}
  dialog{border:0;border-radius:12px;max-width:720px;width:94%;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog .cab{background:var(--vino);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:start}
  dialog .cab h2{margin:0;font-size:18px} dialog .cab button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
  dialog .cuerpo{padding:14px 18px;max-height:70vh;overflow:auto}
  .linea-tiempo{border-left:2px solid var(--linea);margin-left:6px;padding-left:16px}
  .hito{position:relative;margin:0 0 14px}
  .hito:before{content:"";position:absolute;left:-23px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--oro)}
  .hito.sesion:before{background:var(--vino)}
  footer{color:var(--gris);font:12px system-ui,sans-serif;text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header>
  <h1>Monitor jurídico</h1>
  <p id="estado">Cargando archivo…</p>
</header>
<nav id="pestanas"></nav>
<div class="contenedor">
  <div class="filtros">
    <div class="fila"><input type="search" id="q" placeholder="Buscar: prisión preventiva, 25/2026, Ley de Amparo, Ríos González…"></div>
    <div class="fila" id="materias"></div>
    <div class="fila">
      <span>Del</span><input type="date" id="desde"><span>al</span><input type="date" id="hasta">
      <select id="ponente"><option value="">Toda ponencia</option></select>
      <select id="tipo"><option value="">Todo tipo de asunto</option></select>
    </div>
    <div class="fila">
      <label class="check"><input type="checkbox" id="sinTramite"> Ocultar asuntos de trámite</label>
      <label class="check"><input type="checkbox" id="soloCambios"> Solo cambios de criterio</label>
      <button class="chip" id="limpiar">Limpiar filtros</button>
    </div>
  </div>
  <div class="resumen"><span id="cuenta"></span><span id="actualizado"></span></div>
  <div id="lista"></div>
</div>
<dialog id="modal"><div class="cab"><h2 id="mTitulo"></h2><button onclick="modal.close()" aria-label="Cerrar">×</button></div><div class="cuerpo" id="mCuerpo"></div></dialog>
<footer>Datos tomados de fuentes oficiales: SCJN (versiones taquigráficas, listas oficiales, Semanario Judicial) y DOF (SIDOF). Clasificación automática por reglas; verifica siempre en la fuente.</footer>

<script>var DATOS = [];</script>
<script src="datos/indice.js"></script>
<script>
  if (typeof INDICE !== "undefined") {
    INDICE.meses.forEach(function (m) { document.write('<script src="datos/' + m + '.js"><\/script>'); });
  }
</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const fechaLarga = (f) => { const p = (f || "").split("-"); return p.length === 3 ? `${+p[2]} de ${MESES[+p[1]-1]} de ${p[0]}` : (f || "Sin fecha"); };
  const NOMBRE = {sesion: "Sesión del Pleno", agenda: "Agenda", tesis: "Tesis", dof: "DOF", comunicado: "Comunicado"};

  if (typeof INDICE === "undefined") { $("estado").textContent = "Todavía no hay datos: la página se llena después de la primera revisión."; return; }

  const REG = [], SES = {};
  DATOS.forEach((m) => { m.registros.forEach((r) => REG.push(r)); m.sesiones.forEach((s) => SES[s.id] = s); });
  REG.forEach((r) => r._q = norm([r.titulo, r.texto, r.numero, r.tipo, r.ponente, r.estado, r.instancia, (r.materias||[]).join(" "), r.cuerpo, r.precedente].join(" ")));
  REG.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  const porClave = {};
  REG.forEach((r) => { if (r.clave) (porClave[r.clave] = porClave[r.clave] || []).push(r); });

  $("estado").textContent = `Archivo de decisiones de la SCJN, jurisprudencia y Diario Oficial · ${INDICE.total.toLocaleString("es-MX")} registros`;
  $("actualizado").textContent = "Actualizado: " + INDICE.actualizado;

  // ----- pestañas
  const PESTANAS = [["todo","Todo"],["scjn","⭐ Jurisprudencia SCJN"],["sesion","Sesiones del Pleno"],["agenda","Agenda"],["tesis","Tesis"],["dof","DOF"],["comunicado","Comunicados"]];
  let pestana = "todo";
  PESTANAS.forEach(([k, t]) => { const b = document.createElement("button"); b.textContent = t; b.dataset.k = k; b.onclick = () => { pestana = k; pintar(true); }; $("pestanas").appendChild(b); });

  // ----- filtros
  const materias = [...new Set(REG.flatMap((r) => r.materias || []))].sort();
  const elegidas = new Set();
  materias.forEach((m) => { const c = document.createElement("button"); c.className = "chip"; c.textContent = m;
    c.onclick = () => { elegidas.has(m) ? elegidas.delete(m) : elegidas.add(m); c.classList.toggle("on"); pintar(true); }; $("materias").appendChild(c); });
  const llenar = (sel, valores) => valores.forEach((v) => { const o = document.createElement("option"); o.value = o.textContent = v; sel.appendChild(o); });
  llenar($("ponente"), [...new Set(REG.map((r) => r.ponente).filter(Boolean))].sort());
  llenar($("tipo"), [...new Set(REG.filter((r) => r.f === "sesion" || r.f === "agenda").map((r) => r.tipo).filter(Boolean))].sort());
  ["q","desde","hasta","ponente","tipo","sinTramite","soloCambios"].forEach((id) => $(id).addEventListener("input", () => pintar(true)));
  $("limpiar").onclick = () => { ["q","desde","hasta","ponente","tipo"].forEach((id) => $(id).value = ""); $("sinTramite").checked = $("soloCambios").checked = false;
    elegidas.clear(); document.querySelectorAll("#materias .chip").forEach((c) => c.classList.remove("on")); pintar(true); };

  function pasa(r) {
    if (pestana === "scjn" && !(r.f === "tesis" && r.scjn && r.tipo === "Jurisprudencia")) return false;
    if (!["todo","scjn"].includes(pestana) && r.f !== pestana) return false;
    const q = norm($("q").value).trim();
    if (q && !q.split(/\s+/).every((p) => r._q.includes(p))) return false;
    if (elegidas.size && !(r.materias || []).some((m) => elegidas.has(m))) return false;
    if ($("desde").value && r.fecha < $("desde").value) return false;
    if ($("hasta").value && r.fecha > $("hasta").value) return false;
    if ($("ponente").value && r.ponente !== $("ponente").value) return false;
    if ($("tipo").value && r.tipo !== $("tipo").value) return false;
    if ($("sinTramite").checked && r.tramite) return false;
    if ($("soloCambios").checked && !((r.alertas || []).length || r.contradiccion)) return false;
    return true;
  }

  // ----- tarjetas
  function tarjeta(r) {
    const mats = (r.materias || []).map((m) => `<span class="mat">${esc(m)}</span>`).join("");
    let meta = `<span class="badge ${r.f}">${NOMBRE[r.f] || r.f}</span>`;
    let extra = "", acciones = [];
    if (r.f === "sesion") {
      meta += `<span>${esc(r.estado)}</span>` + (r.ponente ? `<span>Ponencia ${esc(r.ponente)}</span>` : "");
      acciones.push(`<button data-ses="${esc(r.sesion)}">Ver sesión y votaciones</button>`);
      acciones.push(`<a href="${esc(r.url)}" target="_blank" rel="noopener">Versión taquigráfica</a>`);
    } else if (r.f === "agenda") {
      meta += `<span>Lista del ${esc(fechaLarga(r.fecha))}${r.orden ? " · núm. " + r.orden : ""}</span>` + (r.ponente ? `<span>Ponencia ${esc(r.ponente)}</span>` : "");
      if (r.desde) extra += `<div class="meta">En lista desde el ${esc(r.desde)}${(r.historial||[]).length ? " · " + esc(r.historial.join("; ")) : ""}</div>`;
      if (r.proyecto) acciones.push(`<a href="${esc(r.proyecto)}" target="_blank" rel="noopener">Proyecto de sentencia</a>`);
      acciones.push(`<a href="${esc(r.url)}" target="_blank" rel="noopener">Lista oficial</a>`);
    } else if (r.f === "tesis") {
      meta += `<span>${esc(r.tipo)}</span><span>${esc(r.instancia)}</span>` + ((r.alertas||[]).length ? `<span class="badge alerta">Cambio de criterio</span>` : "")
            + (r.contradiccion ? `<span>Contradicción de criterios</span>` : "");
      if ((r.alertas||[]).length) extra += `<div class="meta">⚠️ ${esc(r.alertas.join("; "))}</div>`;
      const det = [];
      if (r.cuerpo) det.push(`<div class="bloque">${esc(r.cuerpo)}</div>`);
      if (r.precedente) det.push(`<div class="bloque"><b>Precedente:</b> ${esc(r.precedente)}</div>`);
      if ((r.referencias||[]).length) det.push(`<div class="bloque"><b>Cita:</b> ${esc(r.referencias.join(", "))}</div>`);
      if ((r.votos||[]).length) det.push(`<ul class="votos">${r.votos.map((v) => `<li><a href="${esc(v.u)}" target="_blank" rel="noopener">${esc(v.d)}</a></li>`).join("")}</ul>`);
      if (det.length) extra += `<details><summary>Texto, precedente y votos</summary>${det.join("")}</details>`;
      acciones.push(`<a href="${esc(r.url)}" target="_blank" rel="noopener">Ver en el Semanario</a>`);
    } else if (r.f === "dof") {
      meta += `<span>${esc(r.tipo)}</span><span>Edición ${esc(r.edicion)}</span>`;
      acciones.push(`<a href="${esc(r.url)}" target="_blank" rel="noopener">Leer en el DOF</a>`);
    } else if (r.f === "comunicado") {
      if ((r.asuntos||[]).length) extra += `<div class="meta">${esc(r.asuntos.join(" · "))}</div>`;
      acciones.push(`<a href="${esc(r.url)}" target="_blank" rel="noopener">Leer comunicado</a>`);
    }
    if (r.clave && (porClave[r.clave] || []).length > 1) acciones.unshift(`<button data-clave="${esc(r.clave)}">Seguimiento (${porClave[r.clave].length})</button>`);
    const scjn = r.f === "tesis" && r.scjn && r.tipo === "Jurisprudencia" ? " scjn" : "";
    return `<div class="tarjeta ${r.f}${scjn}"><div class="meta">${meta}</div><div class="titulo">${esc(r.titulo)}</div>
      ${r.texto ? `<div class="texto">${esc(r.texto)}</div>` : ""}${extra}${mats ? `<div class="mats">${mats}</div>` : ""}
      <div class="acciones">${acciones.join("")}</div></div>`;
  }

  let limite = 120;
  function pintar(reiniciar) {
    if (reiniciar) limite = 120;
    document.querySelectorAll("#pestanas button").forEach((b) => b.classList.toggle("activo", b.dataset.k === pestana));
    const res = REG.filter(pasa);
    $("cuenta").textContent = res.length === 1 ? "1 resultado" : `${res.length.toLocaleString("es-MX")} resultados`;
    if (!res.length) { $("lista").innerHTML = `<div class="vacio">No hay resultados con estos filtros.</div>`; return; }
    let html = "", dia = "";
    res.slice(0, limite).forEach((r) => { if (r.fecha !== dia) { dia = r.fecha; html += `<div class="dia">${esc(fechaLarga(dia))}</div>`; } html += tarjeta(r); });
    if (res.length > limite) html += `<button class="mas" id="mas">Ver ${Math.min(120, res.length - limite)} más</button>`;
    $("lista").innerHTML = html;
    if ($("mas")) $("mas").onclick = () => { limite += 120; pintar(false); };
  }

  // ----- ventanas: sesión y seguimiento
  const modal = $("modal"); window.modal = modal;
  $("lista").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.ses) verSesion(b.dataset.ses);
    if (b.dataset.clave) verSeguimiento(b.dataset.clave);
  });
  function verSesion(id) {
    const s = SES[id]; if (!s) return;
    const asuntos = REG.filter((r) => r.sesion === id);
    const grupos = {}; asuntos.forEach((a) => (grupos[a.estado || "Sin estado"] = grupos[a.estado || "Sin estado"] || []).push(a));
    $("mTitulo").textContent = "Sesión del Pleno · " + fechaLarga(s.fecha);
    $("mCuerpo").innerHTML =
      `<p><a href="${esc(s.url)}" target="_blank" rel="noopener">Versión taquigráfica (PDF)</a> · ${s.n} asuntos</p>` +
      Object.entries(grupos).map(([e, l]) => `<h3>${esc(e)} (${l.length})</h3><ul>${l.map((a) => `<li><b>${esc(a.titulo)}</b>${a.ponente ? " · " + esc(a.ponente) : ""}</li>`).join("")}</ul>`).join("") +
      (s.votaciones.length ? `<h3>Votaciones informadas por la Secretaría</h3><ul class="votos">${s.votaciones.map((v) => `<li>${esc(v)}</li>`).join("")}</ul>` : "") +
      (s.votos.length ? `<h3>Votos anunciados</h3><ul class="votos">${s.votos.map((v) => `<li><b>${esc(v.quien)}:</b> ${esc(v.texto)}</li>`).join("")}</ul>` : "");
    modal.showModal();
  }
  function verSeguimiento(clave) {
    const l = (porClave[clave] || []).slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
    $("mTitulo").textContent = "Seguimiento · " + l[0].titulo;
    $("mCuerpo").innerHTML = `<p class="texto">${esc(l[0].texto)}</p><div class="linea-tiempo">` + l.map((r) =>
      `<div class="hito ${r.f}"><b>${esc(fechaLarga(r.fecha))}</b> — ${r.f === "agenda" ? "En la lista para sesión" + (r.orden ? " (núm. " + r.orden + ")" : "") : "Sesión: " + esc(r.estado)}
       ${r.ponente ? "<br><span class='meta'>Ponencia " + esc(r.ponente) + "</span>" : ""}
       ${r.proyecto ? `<br><a href="${esc(r.proyecto)}" target="_blank" rel="noopener">Proyecto</a>` : ""}
       ${r.sesion ? `<br><button class="chip" onclick="document.dispatchEvent(new CustomEvent('ses',{detail:'${esc(r.sesion)}'}))">Ver votaciones de la sesión</button>` : ""}</div>`).join("") + `</div>`;
    modal.showModal();
  }
  document.addEventListener("ses", (e) => { modal.close(); verSesion(e.detail); });

  pintar(true);
})();
</script>
</body>
</html>
